name: publish

# Manual only. The guard below and the job condition refuse every ref but main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publish runs only on refs/heads/main, not $GITHUB_REF" >&2
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/build-guacd-image "$IMAGE:sha-$GITHUB_SHA"

      - name: Gate (stages 1 to 4, before any push)
        run: scripts/guacd-image-gate "$IMAGE:sha-$GITHUB_SHA" "$(cat BASE)"

      - name: Vulnerability scan (report only)
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          fail-build: false
          output-format: table

      - name: Push
        id: push
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "unexpected digest: $digest" >&2
            exit 1
          fi
          media="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --raw | jq -r .mediaType)"
          case "$media" in
            *image.manifest*) ;;
            *) echo "the pushed digest is not a single image manifest: $media" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "- image: \`$IMAGE@$DIGEST\`"
            echo "- base: \`$(cat BASE)\`"
            echo "- tzdata: \`$(docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE:sha-$GITHUB_SHA" -c 'apk info -e -v tzdata')\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run: \`$GITHUB_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
